<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-labelledby="title desc">
<title id="title">Slalom secondary colors</title>
<desc id="desc">Cyan #1BE1F2, Coral Red #FF4D5F, Purple #C7B9FF, and Chartreuse #DEFF4D.</desc>
<rect width="880" height="240" fill="white"/>
<g font-family="Arial,sans-serif" fill="black">
<rect x="20" y="20" width="195" height="130" rx="12" fill="#1BE1F2"/>
<text x="20" y="184" font-size="22">Cyan</text><text x="20" y="214" font-size="18">#1BE1F2</text>
<rect x="235" y="20" width="195" height="130" rx="12" fill="#FF4D5F"/>
<text x="235" y="184" font-size="22">Coral Red</text><text x="235" y="214" font-size="18">#FF4D5F</text>
<rect x="450" y="20" width="195" height="130" rx="12" fill="#C7B9FF"/>
<text x="450" y="184" font-size="22">Purple</text><text x="450" y="214" font-size="18">#C7B9FF</text>
<rect x="665" y="20" width="195" height="130" rx="12" fill="#DEFF4D"/>
<text x="665" y="184" font-size="22">Chartreuse</text><text x="665" y="214" font-size="18">#DEFF4D</text>
</g></svg>
