meta:
  archetype: "hls-project-kickoff"
  client: "Northstar Life Sciences"
  title: "Life Sciences Cloud implementation"
  subtitle: "Project kickoff"
  date: "2026-10-05"
  authors:
    -
      name: "Joint delivery team"
      role: "Northstar Life Sciences and Slalom"
  classification: "Fictional example · For structure review"
  accent: "cyan"
sections:
  -
    module: "objectives-and-scope"
    view: "purpose"
    title: "Purpose and scope"
    body: "Northstar Life Sciences is implementing Salesforce Life Sciences Cloud to support territory and marketing teams with consistent account, contact, and opportunity workflows.\n\nThe initial release includes prioritized configuration, integration, migration, testing, and user enablement. Later personas and additional capabilities will be assessed through subsequent release planning."
  -
    module: "kickoff-context"
    view: "agenda"
    title: "Today's agenda"
    items:
      -
        title: "Purpose and team"
        detail: "Align on the release purpose, participants, and responsibilities."
      -
        title: "Delivery approach"
        detail: "Review phases, workstreams, and the implementation schedule."
      -
        title: "Ways of working"
        detail: "Agree meeting cadence, collaboration norms, and story readiness."
      -
        title: "Governance and next steps"
        detail: "Confirm accountability, operating roles, risks, and immediate actions."
  -
    module: "team-and-responsibilities"
    view: "profiles"
    title: "Meet the team"
    roles:
      -
        id: "sponsor"
        name: "Executive sponsor"
        organization: "Northstar Life Sciences"
        person: "Robin Chen"
        location: "Boston"
        summary: "Owns executive alignment and funding."
        detail: "Resolves escalated scope and investment decisions; sponsors organizational adoption."
      -
        id: "lead"
        name: "Engagement lead"
        organization: "Slalom"
        person: "Avery Morgan"
        location: "Chicago"
        summary: "Accountable for delivery quality."
        detail: "Coordinates delivery leadership and reviews major commitments with the client sponsor."
      -
        id: "po"
        name: "Product owner"
        organization: "Northstar Life Sciences"
        person: "Jordan Lee"
        location: "Denver"
        summary: "Prioritizes the product backlog."
        detail: "Confirms business priorities and acceptance criteria; coordinates feedback from territory and marketing teams."
      -
        id: "pm"
        name: "Program manager"
        organization: "Slalom"
        person: "Taylor Brooks"
        location: "Seattle"
        summary: "Coordinates the delivery plan."
        detail: "Maintains dependencies, risks, budget, meeting cadence, and decisions with the client program owner."
      -
        id: "sa"
        name: "Solution architect"
        organization: "Slalom"
        person: "Morgan Patel"
        location: "Chicago"
        summary: "Owns the functional solution."
        detail: "Connects persona needs to Salesforce capabilities and defines cross-workstream solution decisions."
      -
        id: "dev"
        name: "Salesforce engineer"
        organization: "Slalom"
        person: "Alex Rivera"
        location: "Austin"
        summary: "Builds and tests functionality."
        detail: "Configures Life Sciences Cloud, implements approved extensions, and documents unit-test evidence."
      -
        id: "qa"
        name: "Quality lead"
        organization: "Slalom"
        person: "Casey Kim"
        location: "Atlanta"
        summary: "Coordinates test evidence and defects."
        detail: "Plans functional testing, validates acceptance criteria, and supports business testers during UAT."
      -
        id: "change"
        name: "Change and adoption lead"
        organization: "Northstar Life Sciences"
        person: "Sam Ellis"
        location: "Boston"
        summary: "Coordinates user readiness."
        detail: "Works with change champions to prepare training, communications, and adoption feedback."
      -
        id: "it"
        name: "Enterprise architect"
        organization: "Northstar Life Sciences"
        person: "Jamie Park"
        location: "Denver"
        summary: "Owns enterprise dependencies."
        detail: "Reviews integration, migration, environment, and identity decisions with system owners."
  -
    module: "delivery-approach"
    view: "phase-progression"
    title: "A phased approach"
    phases:
      -
        name: "Plan"
        window: "Oct 2026"
        summary: "Confirm the foundation and release priorities."
        outcomes:
          - "Prioritized personas and capabilities"
          - "Agreed solution approach"
        milestones:
          - "Kickoff and scope alignment"
      -
        name: "Build and learn"
        window: "Nov 2026 to Jan 2027"
        summary: "Deliver increments with regular business feedback."
        outcomes:
          - "Configured sales and marketing workflows"
          - "Integration and migration rehearsals"
        milestones:
          - "Sprint demonstrations"
          - "Test readiness review"
      -
        name: "Validate and launch"
        window: "Feb to Mar 2027"
        summary: "Validate the release and prepare users."
        outcomes:
          - "Accepted business scenarios"
          - "Trained champions and release preparation"
        milestones:
          - "Go-live readiness review"
          - "Initial launch"
      -
        name: "Scale"
        window: "Apr 2027 onward"
        summary: "Use pilot feedback to shape subsequent releases."
        outcomes:
          - "Adoption feedback"
          - "Prioritized follow-on roadmap"
        milestones:
          - "Release planning review"
  -
    module: "delivery-approach"
    view: "workstream-schedule"
    title: "Implementation schedule"
    start: "2026-10-05"
    end: "2027-03-26"
    workstreams:
      -
        id: "build"
        name: "Configuration and build"
        summary: "Incremental capabilities for initial personas"
      -
        id: "data"
        name: "Data migration and integration"
        summary: "Rehearse transfers and validate connected systems"
      -
        id: "test"
        name: "Testing and release"
        summary: "Gather evidence before release decisions"
      -
        id: "change"
        name: "Change and adoption"
        summary: "Prepare people alongside the solution"
    tasks:
      -
        id: "plan"
        workstream: "build"
        name: "Sprint 0"
        start: "2026-10-05"
        end: "2026-10-23"
        owner: "Solution architect"
        detail: "Confirm scope, environments, backlog readiness, and delivery assumptions."
      -
        id: "s1"
        workstream: "build"
        name: "Sprint 1"
        start: "2026-10-26"
        end: "2026-11-13"
        owner: "Salesforce engineer"
        detail: "Configure account and territory foundations; demonstrate completed scenarios."
      -
        id: "s2"
        workstream: "build"
        name: "Sprint 2"
        start: "2026-11-16"
        end: "2026-12-04"
        owner: "Salesforce engineer"
        detail: "Build lead and contact workflows with product-owner feedback."
      -
        id: "s3"
        workstream: "build"
        name: "Sprint 3"
        start: "2026-12-07"
        end: "2026-12-18"
        owner: "Salesforce engineer"
        detail: "Complete prioritized opportunity workflows and address demonstration feedback."
      -
        id: "s4"
        workstream: "build"
        name: "Sprint 4"
        start: "2027-01-04"
        end: "2027-01-22"
        owner: "Salesforce engineer"
        detail: "Complete release scope and resolve integration feedback."
      -
        id: "mapping"
        workstream: "data"
        name: "Data mapping"
        start: "2026-10-12"
        end: "2026-11-13"
        owner: "Enterprise architect"
        detail: "Map source fields and establish ownership for data-quality exceptions."
      -
        id: "integrations"
        workstream: "data"
        name: "Integration build"
        start: "2026-11-02"
        end: "2027-01-15"
        owner: "Enterprise architect"
        detail: "Implement approved exchange patterns and validate failure handling."
      -
        id: "mock"
        workstream: "data"
        name: "Migration rehearsal"
        start: "2027-01-18"
        end: "2027-02-05"
        owner: "Enterprise architect"
        detail: "Rehearse migration, reconcile results, and document remaining exceptions."
      -
        id: "sit"
        workstream: "test"
        name: "System integration testing"
        start: "2027-01-25"
        end: "2027-02-12"
        owner: "Quality lead"
        detail: "Exercise cross-system scenarios and capture test evidence."
      -
        id: "uat"
        workstream: "test"
        name: "User acceptance testing"
        start: "2027-02-15"
        end: "2027-03-05"
        owner: "Product owner"
        detail: "Business testers validate agreed scenarios and record outcomes."
      -
        id: "launch"
        workstream: "test"
        name: "Deploy and support"
        start: "2027-03-08"
        end: "2027-03-26"
        owner: "Program manager"
        detail: "Coordinate release preparation, launch, and initial support."
      -
        id: "training"
        workstream: "change"
        name: "Training preparation"
        start: "2026-11-02"
        end: "2027-02-12"
        owner: "Change and adoption lead"
        detail: "Develop role-based training iteratively with change champions."
      -
        id: "enable"
        workstream: "change"
        name: "Champion enablement"
        start: "2027-02-15"
        end: "2027-03-12"
        owner: "Change and adoption lead"
        detail: "Prepare champions and coordinate launch communications."
      -
        id: "adoption"
        workstream: "change"
        name: "Adoption support"
        start: "2027-03-15"
        end: "2027-03-26"
        owner: "Change and adoption lead"
        detail: "Collect early feedback and route support needs."
    milestones:
      -
        name: "Test readiness"
        date: "2027-01-22"
        detail: "Review scope and test prerequisites."
      -
        name: "Go-live readiness"
        date: "2027-03-05"
        detail: "Review evidence and agree the release decision."
      -
        name: "Initial launch"
        date: "2027-03-15"
        detail: "Begin the agreed pilot rollout."
    blackouts:
      -
        name: "Year-end pause"
        start: "2026-12-21"
        end: "2027-01-01"
  -
    module: "ways-of-working"
    view: "meeting-cadence"
    title: "Meeting cadence"
    meetings:
      -
        title: "Backlog refinement"
        frequency: "Twice weekly, 60 minutes"
        owner: "Solution architect"
        summary: "Prepare future stories and clarify dependencies."
        participants:
          - "Product owner"
          - "Delivery team"
          - "Business SMEs"
        detail: "Review requirements, acceptance criteria, estimates, and open questions before sprint planning."
      -
        title: "Sprint planning"
        frequency: "Every three weeks, 90 minutes"
        owner: "Program manager"
        summary: "Agree a realistic sprint commitment."
        participants:
          - "Product owner"
          - "Delivery team"
        detail: "Confirm goals, capacity, dependencies, and scope before work begins."
      -
        title: "Daily standup"
        frequency: "Daily, 15 minutes"
        owner: "Program manager"
        summary: "Surface progress, blockers, and collaboration needs."
        participants:
          - "Delivery team"
          - "Client core team"
        detail: "Keep updates concise and move detailed problem solving into focused follow-up sessions."
      -
        title: "Sprint demonstration"
        frequency: "Every three weeks, 60 minutes"
        owner: "Solution architect"
        summary: "Review working functionality and capture feedback."
        participants:
          - "Product owner"
          - "Delivery team"
          - "Change champions"
        detail: "Demonstrate completed scenarios; record decisions and refinement needs in the backlog."
      -
        title: "Retrospective"
        frequency: "Every three weeks, 30 minutes"
        owner: "Program manager"
        summary: "Improve how the team delivers."
        participants:
          - "Delivery team"
        detail: "Agree a small set of owned improvements and review their effect next sprint."
      -
        title: "Program status"
        frequency: "Weekly, 45 minutes"
        owner: "Program manager"
        summary: "Review milestones, risks, and decisions."
        participants:
          - "Client program team"
          - "Workstream leads"
        detail: "Maintain shared visibility of schedule changes, blockers, and needed decisions."
      -
        title: "Steering committee"
        frequency: "Monthly, 60 minutes"
        owner: "Engagement lead"
        summary: "Resolve strategic trade-offs and escalations."
        participants:
          - "Executive sponsors"
          - "Program leadership"
        detail: "Review delivery health and decisions requiring executive direction."
      -
        title: "Change and adoption sync"
        frequency: "Every other week, 45 minutes"
        owner: "Change and adoption lead"
        summary: "Coordinate readiness, communication, and training."
        participants:
          - "Change champions"
          - "Program manager"
        detail: "Review user feedback and planned enablement activities alongside delivery progress."
  -
    module: "ways-of-working"
    view: "team-norms"
    title: "Our working agreements"
    items:
      -
        title: "Protect collaboration time"
        summary: "Agree overlapping hours across the team."
        detail: "Use the shared calendar to identify collaboration windows. Surface availability changes early."
      -
        title: "Keep decisions visible"
        summary: "Maintain one shared record of work and decisions."
        detail: "Record acceptance criteria, decisions, test evidence, and delivery progress in the agreed tracking system."
      -
        title: "Raise blockers early"
        summary: "Make dependencies and support needs explicit."
        detail: "Name an owner and the needed decision when raising a blocker; use the agreed escalation path when timing threatens delivery."
  -
    module: "delivery-workflow"
    view: "pipeline"
    title: "User story workflow"
    roles:
      -
        id: "po"
        name: "Product owner"
      -
        id: "sa"
        name: "Solution architect"
      -
        id: "dev"
        name: "Salesforce engineer"
      -
        id: "qa"
        name: "Quality lead"
    stages:
      -
        id: "todo"
        name: "To do"
        summary: "Awaiting refinement and prioritization."
        detail: "Capture the user need and the intended outcome."
        roles:
          - "po"
      -
        id: "refine"
        name: "In refinement"
        summary: "Clarify requirements and design."
        detail: "Document acceptance criteria, dependencies, estimates, and open questions."
        roles:
          - "po"
          - "sa"
      -
        id: "ready"
        name: "Ready for development"
        summary: "Meets the agreed readiness criteria."
        detail: "Confirm prerequisites before assigning implementation work."
        roles:
          - "sa"
          - "dev"
      -
        id: "dev"
        name: "In development"
        summary: "Build and unit testing underway."
        detail: "Complete implementation, unit evidence, and peer review."
        roles:
          - "dev"
      -
        id: "readyqa"
        name: "Ready for QA"
        summary: "Ready to test in the QA environment."
        detail: "Provide deployment notes and testable acceptance criteria."
        roles:
          - "dev"
          - "qa"
      -
        id: "qa"
        name: "In QA"
        summary: "Validate functionality and evidence."
        detail: "Run planned scenarios and record results."
        roles:
          - "qa"
      -
        id: "failed"
        name: "QA rework"
        summary: "Resolve issues identified in testing."
        detail: "Return defects to the developer with reproduction steps; retest the fix."
        roles:
          - "dev"
          - "qa"
      -
        id: "uat"
        name: "Ready for UAT"
        summary: "Ready for business validation."
        detail: "Provide passing QA evidence and confirm the agreed sprint Definition of Done."
        roles:
          - "qa"
          - "po"
    transitions:
      -
        to: "refine"
        label: "Prioritized"
        from: "todo"
      -
        to: "ready"
        label: "Ready criteria met"
        from: "refine"
      -
        to: "dev"
        label: "Assigned"
        from: "ready"
      -
        to: "readyqa"
        label: "Review complete"
        from: "dev"
      -
        to: "qa"
        label: "Testing started"
        from: "readyqa"
      -
        to: "failed"
        label: "Test failed"
        from: "qa"
      -
        to: "readyqa"
        label: "Fix ready for retest"
        from: "failed"
      -
        to: "uat"
        label: "Tests passed"
        from: "qa"
  -
    module: "delivery-workflow"
    view: "readiness"
    title: "Ready and done"
    items:
      -
        title: "Definition of Ready"
        summary: "Agreed prerequisites for development."
        detail: "- Requirements and acceptance criteria are documented.\n- The product owner has reviewed the story.\n- Solution notes, dependencies, and estimates are available."
      -
        title: "Definition of Done: sprint level"
        summary: "Agreed conditions before business validation."
        detail: "- Implementation and peer review are complete.\n- Acceptance criteria have passed QA with recorded evidence.\n- Changes are available in the UAT environment."
