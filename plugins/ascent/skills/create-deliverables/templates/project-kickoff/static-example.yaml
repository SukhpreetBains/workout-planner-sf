    module: "timeline-roadmap"
    view: "timeline"
    title: "Timeline / roadmap"
    time_scale: "month"
    phases:
      -
        name: "Align"
        window: "September"
        start: "2026-09-14"
        end: "2026-09-25"
        summary: "Establish shared outcomes, evidence, and working agreements."
        outcomes: ["Kickoff complete", "Success measures aligned"]
        activities:
          -
            title: "Confirm outcomes"
            detail: "Align objectives, measures, and decision boundaries."
          -
            title: "Mobilize the team"
            detail: "Confirm access, participants, and working agreements."
        decision: "Confirm readiness to begin design."
        milestones:
          -
            title: "Kickoff"
            date: "2026-09-14"
            detail: "Launch the engagement and confirm the operating model."
      -
        name: "Design"
        window: "September to October"
        start: "2026-09-21"
        end: "2026-10-23"
        summary: "Turn evidence into experience and solution decisions."
        outcomes: ["Experience direction approved", "Architecture decisions recorded"]
        activities:
          -
            title: "Shape the experience"
            detail: "Prototype priority journeys with users and stakeholders."
          -
            title: "Resolve architecture"
            detail: "Confirm the technical direction and delivery constraints."
        decision: "Approve the MVP direction."
        milestones:
          -
            title: "MVP signoff"
            date: "2026-10-23"
            detail: "Approve the experience and solution boundary."
      -
        name: "Build"
        window: "October to December"
        start: "2026-10-12"
        end: "2026-12-04"
        summary: "Deliver working increments and retire implementation risk."
        outcomes: ["Priority capabilities implemented", "Release candidate ready"]
        activities:
          -
            title: "Deliver increments"
            detail: "Build and demonstrate usable slices every two weeks."
          -
            title: "Integrate continuously"
            detail: "Validate quality, data, and system behavior throughout delivery."
        decision: "Confirm the release candidate is ready for validation."
        milestones:
          -
            title: "Build ready"
            date: "2026-12-04"
            detail: "Complete the agreed MVP scope for formal validation."
      -
        name: "Validate"
        window: "December"
        start: "2026-12-01"
        end: "2026-12-23"
        summary: "Establish business, technical, and operational confidence."
        outcomes: ["Acceptance criteria met", "Launch readiness confirmed"]
        activities:
          -
            title: "Run acceptance testing"
            detail: "Validate priority scenarios with business owners."
          -
            title: "Assess readiness"
            detail: "Close critical defects and confirm launch support."
        decision: "Authorize production launch."
        milestones:
          -
            title: "UAT start"
            date: "2026-12-01"
            detail: "Begin formal business acceptance."
          -
            title: "Launch decision"
            date: "2026-12-23"
            detail: "Confirm readiness to release."
      -
        name: "Transition"
        window: "January"
        start: "2027-01-04"
        end: "2027-01-15"
        summary: "Launch the solution and transfer durable ownership."
        outcomes: ["Solution live", "Operational ownership transferred"]
        activities:
          -
            title: "Launch and stabilize"
            detail: "Monitor production behavior and resolve launch issues."
          -
            title: "Transfer ownership"
            detail: "Complete enablement, documentation, and handoff."
        decision: "Accept the transition into steady-state ownership."
        milestones:
          -
            title: "Go-live"
            date: "2027-01-04"
            detail: "Release the solution to production."
          -
            title: "Handoff complete"
            date: "2027-01-15"
            detail: "Close hypercare and transfer ownership."
