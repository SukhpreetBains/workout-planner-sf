    title: "Guiding Principles"
    layout: "microsite"
    copy:
      -
        key: "div-module-kicker-1"
        text: "MODULE 07 · ALIGNMENT INTO DELIVERY"
      -
        key: "div-h2-1"
        text: "Guiding Principles"
      -
        key: "div-p-1"
        text: "Shared principles for product, design, architecture, and delivery tradeoffs."
      -
        key: "added-intro-eyebrow-1"
        text: "NORTHSTAR HEALTH · DECISION PRINCIPLES"
      -
        key: "added-intro-h3-1"
        text: "Four principles. Practical choices."
      -
        key: "added-intro-p-1"
        text: "Open a principle to see how it shapes a delivery decision."
      -
        key: "summary-guide-number-1"
        text: "01"
      -
        key: "span-b-1"
        text: "Start with the member"
      -
        key: "span-small-1"
        text: "Make the two MVP service journeys easier to complete."
      -
        key: "guide-item-p-1"
        text: "Prioritize a clear next step over exposing every platform capability. Validate the journey with members before expanding scope."
      -
        key: "summary-guide-number-2"
        text: "02"
      -
        key: "span-b-2"
        text: "Earn trust by design"
      -
        key: "span-small-2"
        text: "Treat privacy, consent, and accessibility as acceptance conditions."
      -
        key: "guide-item-p-2"
        text: "Use approved test data and verify consent at the service boundary. Escalate unresolved constraints before release."
      -
        key: "summary-guide-number-3"
        text: "03"
      -
        key: "span-b-3"
        text: "Reuse before extending"
      -
        key: "span-small-3"
        text: "Build on existing identity and service capabilities."
      -
        key: "guide-item-p-3"
        text: "Check the current platform first. Theo and Jordan review exceptions when reuse cannot meet the agreed outcome."
      -
        key: "summary-guide-number-4"
        text: "04"
      -
        key: "span-b-4"
        text: "Prove value, then expand"
      -
        key: "span-small-4"
        text: "Release a focused MVP and learn from real usage."
      -
        key: "guide-item-p-4"
        text: "Keep additional journeys in the later-release backlog. Rina proposes priority changes; Avery approves changes to the MVP boundary."
      -
        key: "module-visual-added-foot-1"
        text: "When principles conflict, document the tradeoff in the Decision Log and use the agreed decision rights."
      -
        key: "reference-notes-summary-1"
        text: "Design notes"
      -
        key: "div-span-1"
        text: "BEST STORY"
      -
        key: "div-p-2"
        text: "Connect each principle to a concrete choice and a path for handling exceptions."
      -
        key: "div-span-2"
        text: "MOTION PURPOSE"
      -
        key: "div-p-3"
        text: "Principles reveal once in sequence; opening one exposes its decision implications."
      -
