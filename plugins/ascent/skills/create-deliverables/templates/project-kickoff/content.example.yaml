# Worked example for the `project-kickoff` archetype. Meridian Outfitters is a
# fictional specialty-retail client; nothing here describes a real engagement.
meta:
  archetype: project-kickoff
  client: Meridian Outfitters
  title: Service Cloud Discovery: Core Team Kickoff
  subtitle: Aligning on scope, team, and approach before Learn begins
  date: 2026-03-02
  authors:
    - name: Dana Whitfield
      role: Engagement Lead
    - name: Priya Nair
      role: Delivery Solution Lead
  classification: Internal draft
  accent: cyan

sections:
  - module: objectives-and-scope
    view: purpose
    title: Purpose & scope
    body: |
      This kickoff aligns the core discovery team on why we are here, how we
      will work together, and what each of us owns over the next six weeks.

      Scope is Meridian's service and support experience: case management,
      the store-associate console, and the customer self-service portal. Order
      management and merchandising are explicitly out of scope for this
      phase. They return in a later engagement.

      Nothing decided today is final. Discovery is where we test assumptions
      together before committing to a design.

  - module: kickoff-context
    view: agenda
    title: Today's agenda
    items:
      - title: Introductions
        detail: Meet the people responsible for the engagement and understand the perspective each person brings.
      - title: Purpose and scope
        detail: Review why the work is starting, what outcomes matter, and which topics are inside or outside this phase.
      - title: Core team and roles
        detail: Clarify delivery responsibilities, client ownership, decision rights, and escalation paths.
      - title: Approach and timeline
        detail: Walk through the planned phases, major activities, milestones, and review points.
      - title: Key deliverables
        detail: Confirm what the team will produce, who will review each deliverable, and how acceptance will work.
      - title: Risks and open questions
        detail: Surface known risks, assumptions, issues, dependencies, and questions that need early resolution.
      - title: Next steps
        detail: Agree on immediate actions, owners, due dates, and the next working session.

  - module: objectives-and-scope
    view: success-measures
    title: Engagement at a glance
    items:
      - value: 6
        unit: weeks
        label: Discovery duration
        source: Fictional engagement plan
      - value: 3
        label: In-scope service experiences
        source: Fictional statement of work
      - value: 1 in 5
        label: Store associates represented in prototype review
        source: Fictional workshop plan

  - module: team-and-responsibilities
    view: team
    title: Core team & roles
    columns: [Name, Role, Organization, Responsibility]
    rows:
      - cells: [Dana Whitfield, Engagement Lead, Slalom, Overall delivery accountability and executive communication]
      - cells: [Priya Nair, Delivery Solution Lead, Slalom, Day-to-day delivery leadership and workshop facilitation]
      - cells: [Marcus Ito, Solution Architect, Slalom, Salesforce solution design and technical decisions]
      - cells: [Renee Castellano, VP Customer Experience, Meridian Outfitters, Executive sponsor and final scope decisions]
      - cells: [Owen Fielder, Director of Store Operations, Meridian Outfitters, Store-associate console requirements and sign-off]
      - cells: [Aliyah Brandt, IT Program Manager, Meridian Outfitters, Internal coordination and system access]

  - module: delivery-approach
    view: timeline
    title: Approach & timeline
    phases:
      - name: Prepare & mobilize
        window: Weeks 1–2
        outcomes:
          - Team onboarding and system access confirmed
          - Workshop schedule and logistics finalized
          - Current-state documentation collected
      - name: Learn
        window: Weeks 2–4
        outcomes:
          - Current-state process and pain-point workshops complete
          - Stakeholder interviews complete across store and support teams
          - Draft future-state process flows shared for review
      - name: Ideate
        window: Weeks 4–5
        outcomes:
          - Solution options evaluated against MVP scope
          - Integration and data migration approach drafted
          - User experience prototype reviewed with store associates
      - name: Plan
        window: Week 6
        outcomes:
          - Prioritized backlog and implementation roadmap approved
          - Design/deliver phase plan and staffing confirmed

  - module: discovery-and-deliverables
    view: deliverables
    title: Key deliverables
    columns: [Deliverable, Description, Owner]
    rows:
      - cells: [Current-state assessment, Documented pain points and process gaps across case management and the store console, Slalom]
      - cells: [Future-state process flows, One flow per in-scope process, reviewed and signed off by process owners, Slalom]
      - cells: [Implementation roadmap, Sequenced phases and a prioritized backlog for the design/deliver phase, Slalom]
      - cells: [Workshop participation, Subject-matter experts available for scheduled Learn-phase sessions, Meridian Outfitters]

  - module: raid
    view: summary
    title: Risks & open questions
    findings:
      - theme: Store-associate console requirements are not yet documented
        evidence: No current requirements repository exists for the console; knowledge sits with individual store leads.
        implication: Learn-phase workshops need extra time with store operations to avoid gaps carried into design.
        severity: medium
        icon: people
      - theme: Case data quality has not been assessed
        evidence: Meridian has not run a data quality audit on the current case management system.
        implication: A lightweight data audit should be scheduled early so migration planning is not built on an unverified assumption.
        severity: medium
        icon: search

  - module: ways-of-working
    view: logistics
    title: Ways of working
    columns: [Practice, Working agreement, Source of truth]
    rows:
      - cells: [Delivery coordination, Daily core-team check-in and weekly sponsor update, Fictional project calendar]
      - cells: [Project communication, Shared project channel for decisions and working questions, Fictional collaboration plan]
      - cells: [Actions and RAID, One governed register reviewed in the weekly delivery meeting, Fictional delivery plan]

  - module: raid
    view: risk-profile
    title: Initial risk profile
    columns: [Likelihood, Impact]
    rows:
      - capability: Store-associate requirement coverage
        values: [4, 3]
        note: Directional kickoff view, pending discovery validation
      - capability: Case data readiness
        values: [3, 4]
        note: Directional kickoff view, pending a data audit

  - module: kickoff-context
    view: working-agreement
    quote: We need one shared picture of what success means before solution decisions begin.
    name: Executive sponsor
    attribution_title: Meridian Outfitters

  - module: immediate-next-steps
    view: actions
    title: Next steps
    items:
      - Confirm workshop attendee list by end of week
      - Provision Slalom team access to current-state systems
      - Schedule the first Learn-phase workshop for next Tuesday
      - Circulate this deck and the workshop calendar to the full core team
