meta:
  archetype: executive-readout
  client: Northwind Health
  title: Discovery findings and recommendations
  subtitle: Salesforce Service Cloud discovery, six weeks
  date: 2026-08-11
  authors:
    - name: Calvin O'Keefe
      role: Delivery lead
    - name: Priya Raman
      role: Solution architect
  classification: Confidential — prepared for Northwind Health
  accent: cyan

sections:
  - type: exec-summary
    title: In brief
    body: |
      Northwind's service organization is carrying the cost of a fragmented
      agent desktop. Agents move between three systems to answer a routine
      billing question, and the handling time that follows shows up in reopen
      rates, in overtime, and in CSAT.

      Nothing we found requires a platform decision to be revisited. The
      remedies are consolidation, one data contract, and a deliberate
      knowledge practice — all deliverable inside the current license
      footprint.

      We recommend committing to a ninety-day foundation phase now, and
      deferring the self-service program until the desktop is stable.

  - type: kpi-row
    title: Where the cost shows up
    items:
      - value: 34
        unit: "%"
        label: of service cases reopened within 14 days
        source: Case data, January to June 2026
      - value: 2.4
        unit: "x"
        label: average handle time against the industry benchmark
        source: Northwind case data against Salesforce service benchmark, 2026
      - value: 3
        label: systems an agent touches to answer a billing question
        source: Observed in nine agent shadowing sessions
      - value: "1 in 5"
        label: cases where the customer repeats information already on file
        source: Sample of 120 recorded calls, May 2026

  - type: theme-group
    title: What we heard
    body: |
      Four themes recurred across 23 interviews, nine shadowing sessions, and
      the case data. They are ordered by the cost they carry, not by how often
      they came up.
    findings:
      - theme: Fragmented customer view
        evidence: >
          Agents check the CRM, the billing portal, and a shared mailbox before
          answering a billing question. None of the three agrees on the
          customer's current balance.
        implication: >
          Average handle time is 2.4 times the benchmark and CSAT tracks it
          almost exactly. Every additional lookup is roughly forty seconds the
          customer waits on hold.
        severity: high
        icon: network

      - theme: Knowledge lives in people, not in the platform
        evidence: >
          Six of the nine agents we shadowed consulted a personal notes
          document. Two of those documents were last updated in 2024.
        implication: >
          Answers vary by who picks up the phone, and the variance is invisible
          to management. It also makes onboarding a nine-week exercise.
        severity: high
        icon: search

      - theme: Escalation is a relationship, not a process
        evidence: >
          Tier 2 escalations are routed by direct message to named individuals.
          There is no queue and no service level.
        implication: >
          Escalated cases age unpredictably, and the pattern breaks entirely
          when a key individual is on leave.
        severity: medium
        icon: people

      - theme: Reporting is assembled by hand
        evidence: >
          The weekly service report is compiled in a spreadsheet from three
          exports, taking roughly a day and a half of an analyst's week.
        implication: >
          Leadership decisions run a week behind the operation, and the analyst
          time is a direct cost with no upside.
        severity: low
        icon: line-graph

  - type: quote
    quote: We know the answer exists. We just cannot find it fast enough.
    name: Director of service operations
    attribution_title: Northwind Health

  - type: heatmap
    title: Capability assessment
    columns: [Current, Target]
    rows:
      - capability: Case management
        values: [2, 4]
        note: Strong process, weak tooling
      - capability: Unified customer profile
        values: [1, 4]
      - capability: Knowledge management
        values: [1, 3]
      - capability: Escalation and routing
        values: [2, 4]
      - capability: Service reporting
        values: [2, 3]
      - capability: Self-service
        values: [1, 2]
        note: Deliberately deferred until the desktop is stable

  - type: recommendations
    title: What we recommend
    items:
      - action: Consolidate the service desktop
        rationale: >
          Removes the three-system lookup from every interaction, which is the
          single largest contributor to handle time.
        horizon: 0-90 days
        owner: Service operations

      - action: Agree one customer data contract
        rationale: >
          Billing, CRM, and the mailbox disagree today because no system owns
          the balance. Name the owner before building the view.
        horizon: 0-90 days
        owner: Data and platform

      - action: Stand up a governed knowledge base
        rationale: >
          Converts nine personal notes documents into one reviewed source, and
          makes answer quality measurable for the first time.
        horizon: 90-180 days
        owner: Service enablement

      - action: Replace direct-message escalation with a queue
        rationale: >
          Gives escalated cases a service level and removes the dependency on
          named individuals being available.
        horizon: 90-180 days
        owner: Service operations

      - action: Defer the self-service program
        rationale: >
          Self-service built on the current knowledge base would publish the
          inconsistency to customers. Sequence it after the knowledge work.
        horizon: 180+ days
        owner: Digital channels

  - type: roadmap
    title: How it sequences
    phases:
      - name: Foundation
        window: Q4 2026
        outcomes:
          - Single service desktop in pilot with one team
          - Customer data contract agreed and owned
          - Baseline handle time and reopen rate instrumented

      - name: Scale
        window: Q1 2027
        outcomes:
          - Desktop rolled out to all service teams
          - Governed knowledge base live with a review cadence
          - Escalation queue replacing direct-message routing

      - name: Extend
        window: Q2 2027
        outcomes:
          - Service reporting generated rather than assembled
          - Self-service pilot on the governed knowledge base

  - type: next-steps
    title: What we need from you
    items:
      - Confirm the ninety-day foundation scope with the steering committee
      - Name a single owner for the customer data contract
      - Release two service leads for the desktop pilot team
      - Reconvene on 8 September 2026 to review the pilot plan

  - type: methodology
    title: How we got here
    body: |
      Over six weeks we ran 23 interviews across service operations, billing,
      IT, and digital channels; shadowed nine agent shifts across two sites;
      and analysed case, telephony, and CSAT data covering January to June
      2026.

      Interview material is reported in aggregate. Quotations are used with
      the speaker's consent and attributed by role rather than by name.
      Benchmark comparisons use the Salesforce service benchmark for
      comparable case volumes, which is directional rather than exact.
