<template>
    <template lwc:if={plan}>
        <section aria-label="Generated workout plan">
            <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-m-bottom_small">
                <div class="slds-col slds-grow">
                    <h2 class="slds-text-heading_medium">{plan.planTitle}</h2>
                    <p class="slds-text-body_small slds-text-color_weak">
                        {plan.daysPerWeek} sessions &middot; {plan.goal} &middot; {plan.experience}
                    </p>
                </div>
            </div>
            <div class="slds-grid slds-wrap slds-gutters">
                <template for:each={sessions} for:item="session">
                    <div key={session.sessionId} class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_small">
                        <article class="slds-box slds-theme_default">
                            <h3 class="slds-text-heading_small">Session {session.sessionNumber}</h3>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">{session.focus}</p>
                            <template for:each={session.sections} for:item="section">
                                <section key={section.name}>
                                    <h4 class="slds-text-title_bold slds-m-top_medium slds-m-bottom_x-small">{section.name}</h4>
                                    <div class="slds-scrollable_x">
                                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                            <thead>
                                                <tr>
                                                    <th scope="col"><div class="slds-truncate" title="Exercise">Exercise</div></th>
                                                    <th scope="col"><div class="slds-truncate" title="Sets">Sets</div></th>
                                                    <th scope="col"><div class="slds-truncate" title="Reps or time">Reps / Time</div></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={section.exercises} for:item="exercise">
                                                    <tr key={exercise.exerciseId}>
                                                        <th scope="row"><div class="slds-truncate" title={exercise.name}>{exercise.name}</div></th>
                                                        <td>{exercise.sets}</td>
                                                        <td>{exercise.reps}</td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </section>
                            </template>
                        </article>
                    </div>
                </template>
            </div>
        </section>
    </template>
</template>
