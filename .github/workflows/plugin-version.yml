name: Plugin version

on:
  pull_request:
    branches: [main]

jobs:
  version-bump:
    name: Codex plugin version bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare against the current main
        run: |
          git fetch --quiet origin main
          python3 scripts/check_plugin_version_bump.py --base origin/main
